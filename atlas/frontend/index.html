<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="map-wrap">
  <canvas id="map"></canvas>
  <div id="hud"></div>
  <div id="axis-strip" class="hidden">
    <span class="axis-strip-label" id="axis-strip-b"></span>
    <canvas id="axis-strip-canvas"></canvas>
    <span class="axis-strip-label" id="axis-strip-a"></span>
  </div>
</main>
<aside id="panel">
  <header>
    <h1 id="ds-name">Image Atlas</h1>
    <div id="ds-count" class="muted"></div>
  </header>
  <section id="search-box" class="hidden">
    <label for="search-input">Search images</label>
    <input id="search-input" type="search" autocomplete="off"
      placeholder="describe what's in them…">
    <div class="filter-row">
      <button id="search-go">Search</button>
      <button id="search-clear" class="secondary">Clear</button>
      <span id="search-status" class="muted"></span>
    </div>
    <label class="toggle" id="exact-row"><input type="checkbox" id="search-exact">
      Exact text only (OCR)</label>
  </section>
  <section id="axis-box" class="hidden">
    <details id="axis-details">
      <summary class="muted">Semantic axis — project images between two ends</summary>
      <div class="axis-body">
        <div id="axis-x" class="axis-row"><div class="axis-title">Axis 1 (X)</div></div>
        <div id="axis-y" class="axis-row">
          <div class="axis-title">Axis 2 (Y) <span class="muted">— optional → quadrant plot</span></div>
        </div>
        <div class="filter-row">
          <button id="axis-build">Build</button>
          <button id="axis-clear" class="secondary">Clear</button>
          <button id="axis-export" class="secondary hidden">Export coords</button>
        </div>
        <div id="axis-status" class="muted"></div>
        <div id="axis-legend" class="hidden"></div>
      </div>
    </details>
  </section>
  <section id="filter-box">
    <label>Filters</label>
    <div id="filter-controls"></div>
    <div class="filter-row">
      <button id="filter-clear" class="secondary">Clear all</button>
      <span id="filter-status" class="muted"></span>
    </div>
    <details id="advanced-sql">
      <summary class="muted">Advanced: SQL</summary>
      <textarea id="filter-input" rows="2" spellcheck="false"
        placeholder="e.g.  family = 'rings' AND year &gt;= 2000"></textarea>
      <div class="filter-row">
        <button id="filter-apply">Run SQL</button>
      </div>
    </details>
    <div id="filter-error"></div>
  </section>
  <section id="display-box">
    <label for="size-slider">Thumbnail size <span id="size-val"></span></label>
    <input type="range" id="size-slider" min="24" max="96" step="2">
    <div class="toggles">
      <label class="toggle hidden" id="labels-toggle-row">
        <input type="checkbox" id="labels-toggle" checked> Region labels</label>
      <label class="toggle hidden" id="density-toggle-row">
        <input type="checkbox" id="density-toggle" checked> Density underlay</label>
    </div>
  </section>
  <section id="selection" class="hidden">
    <div><strong id="sel-count"></strong> <span class="muted">selected by lasso</span></div>
    <div class="filter-row">
      <button id="sel-export">Export CSV</button>
      <button id="sel-clear" class="secondary">Clear selection</button>
    </div>
  </section>
  <section id="detail" class="hidden">
    <div id="detail-pin" class="muted"></div>
    <img id="detail-img" alt="">
    <table id="detail-meta"></table>
  </section>
  <section id="contents" class="hidden">
    <div id="contents-count" class="muted"></div>
    <canvas id="contents-grid"></canvas>
    <button id="contents-more" class="secondary">Show more</button>
  </section>
  <section id="help" class="muted">
    Drag to pan · wheel to zoom · hover a marker for details · click to pin ·
    <b>Shift-drag</b> to lasso-select. Badges show how many images a marker
    summarizes.
  </section>
</aside>
<script src="./app.js"></script>
</body>
</html>
