# Primary 3 x 3 pilot: interaction structure x population size.
# Frozen once runs start: to change anything, copy to climate_consensus_v2.yaml
# and rename experiment.name (the runner refuses to mix configurations).

experiment:
  name: climate_consensus_v1
  description: >
    Effect of interaction structure and population size on
    consensus among LLM agents.
  output_dir: data/experiments

topic:
  id: climate_change
  title: climate change
  opening_question: >
    What should societies do about climate change, and how
    urgently should they act?

# Starting positions encode priorities and trade-offs, not factual claims.
stance_dimensions:
  climate_risk_concern:
    label: How serious a risk climate change poses
    description: How serious a risk do you think climate change poses?
    low_anchor: a minor concern among many
    high_anchor: one of the most serious risks we face
    loading: 1.0
  policy_urgency:
    label: How urgently societies should act
    description: How urgently should societies act on climate change?
    low_anchor: there is time to wait and see
    high_anchor: act immediately at full scale
    loading: 0.9
  government_intervention:
    label: The role of government
    description: How large a role should government regulation and spending play in the response?
    low_anchor: leave it mainly to markets and individuals
    high_anchor: strong government regulation and investment
    loading: 0.7
  economic_cost_acceptance:
    label: Willingness to accept economic costs
    description: How much economic cost should societies accept to address climate change?
    low_anchor: avoid measures that raise costs
    high_anchor: accept substantial costs
    loading: 0.8
  mitigation_vs_adaptation:
    label: Mitigation versus adaptation
    description: Should the priority be adapting to climate change or cutting emissions to limit it?
    low_anchor: prioritise adaptation
    high_anchor: prioritise mitigation
    loading: 0.6

population_sizes: [10, 50, 100]
environments: [forum, open_dyadic, erdos_renyi]
replicates: 5
rounds: 12
seed: 12345

network:
  type: erdos_renyi
  target_mean_degree: 6
  require_connected: true
  recipient_selection: uniform_random_neighbor

forum:
  scheduler: synchronous

dyadic:
  recipient_selection: uniform_random

exposure_matching:
  enabled: false

initialisation:
  method: stratified
  noise_sd: 0.10

population:
  model_assignment: homogeneous

# Replace with the model under study. Current Claude models reject sampling
# parameters, so `temperature` below is recorded but not sent (logged as
# `temperature_not_sent`); they also think by default, so max_output_tokens
# must leave room for thinking. Effort is set via extra_params.
model:
  provider: anthropic
  model: claude-opus-5
  extra_params:
    output_config:
      effort: low

generation:
  temperature: 0.7
  max_output_tokens: 4000
  message_word_limit: 120

measurement:
  probe_frequency: every_round
  temperature: 0
  max_output_tokens: 4000
  repair_malformed: true

memory:
  strategy: token_budget
  max_context_tokens: 12000
  reserve_own_messages: 2

analysis:
  stance_convergence: true
  lexical_convergence: true
  semantic_convergence: true
  topic_convergence: true
  network_metrics: true
  lexical_top_k: [20, 50, 100]

controls:
  no_interaction: false

stopping:
  type: fixed_rounds

runtime:
  max_concurrency: 16

pricing:
  input_per_mtok: 5.0
  output_per_mtok: 25.0
